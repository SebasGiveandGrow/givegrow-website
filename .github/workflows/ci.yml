name: CI — Gate de validación

on:
  pull_request:
    branches: [main]
    # `labeled` NO está en los tipos por omisión —que son opened, synchronize y
    # reopened— y esa ausencia era una carrera silenciosa: `gh pr create --label`
    # crea el PR y lo etiqueta en DOS llamadas, así que el evento `opened` puede
    # llegar sin la etiqueta. El job `automerge` la busca en el payload del
    # evento, no la busca de nuevo, así que se saltaba: el PR quedaba abierto,
    # con el gate en verde y sin fusionar.
    #
    # Pasó el 22 ago 2026 con el PR #164. Es la misma familia que la cicatriz
    # del #130 que está documentada más abajo: apariencia de éxito y nada
    # avisando. Con `labeled` en la lista, etiquetar dispara su propia
    # evaluación y el PR se fusiona igual llegue la etiqueta al crearlo o
    # después.
    types: [opened, synchronize, reopened, labeled]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate del proyecto (sintaxis, i18n, estructura)
        run: node scripts/validate.mjs

      # El Worker dejó de ser un archivo suelto: importa documentos.js, que
      # importa pdf-lib. `node --check` ve la sintaxis pero no el enlazado, y un
      # import que no resuelve solo aparecería al desplegar — es decir, en
      # producción. El dry-run empaqueta de verdad y no publica nada.
      - name: El Worker empaqueta (bundle + resolución de imports)
        run: |
          npm ci
          npx wrangler@latest deploy --dry-run --outdir /tmp/gg-bundle
          echo "Tamaño del bundle:"
          du -sh /tmp/gg-bundle

      - name: Cache-bust coherente (md5 de assets vs index.html)
        run: |
          CSS_REAL=$(md5sum styles.css | cut -c1-8)
          JS_REAL=$(md5sum app.js | cut -c1-8)
          CSS_DECL=$(grep -oE 'styles\.css\?v=[0-9a-f]+' index.html | head -1 | cut -d= -f2)
          JS_DECL=$(grep -oE 'app\.js\?v=[0-9a-f]+' index.html | head -1 | cut -d= -f2)
          echo "styles.css real=$CSS_REAL declarado=$CSS_DECL"
          echo "app.js     real=$JS_REAL declarado=$JS_DECL"
          if [ "$CSS_REAL" != "$CSS_DECL" ]; then echo "::error::cache-bust de styles.css desactualizado (regla CLAUDE.md)"; exit 1; fi
          if [ "$JS_REAL" != "$JS_DECL" ]; then echo "::error::cache-bust de app.js desactualizado (regla CLAUDE.md)"; exit 1; fi

  automerge:
    needs: validate
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # `actions: write` es lo que permite DISPARAR el deploy. Sin él, el job
      # fusiona el PR y muere en el último paso con
      #   HTTP 403: Resource not accessible by integration
      # dejando `main` desplegado a medias: el cambio está fusionado y
      # producción sigue con el anterior. Nadie se entera, porque el PR
      # aparece fusionado y en verde.
      #
      # Pasó el 19 ago 2026 con el PR #130 —la ruta de terreno de la brigada—
      # y se descubrió por casualidad, comprobando producción a mano antes de
      # una demostración. Es el fallo más caro de esta familia: silencioso y
      # con apariencia de éxito.
      actions: write
    steps:
      # DOS EVENTOS, UN SOLO MERGE. `gh pr create --label automerge` hace DOS
      # llamadas a la API —crea el PR y luego lo etiqueta— así que llegan dos
      # eventos: `opened` y `labeled`. Los dos están en `types`, y cuando la
      # etiqueta alcanza a entrar antes de que GitHub arme el payload del
      # `opened` (un segundo de diferencia basta), LOS DOS pasan el `if` de
      # arriba y los dos jobs corren a fusionar el mismo PR. Uno gana; el otro
      # muere con `GraphQL: Merge already in progress (mergePullRequest)`.
      #
      # Medido el 1 sep 2026: TRECE de los últimos cuarenta runs de este
      # workflow fallaron así, todos con la misma línea. El PR 218 se creó a
      # las 12:47:11, se etiquetó a las 12:47:12, y los dos runs arrancaron a
      # las 12:47:14 y 12:47:15.
      #
      # POR QUÉ IMPORTA, si el PR se fusionaba igual: porque el rojo en
      # `automerge` pasó a ser lo normal. Las dos cicatrices de este archivo
      # —el #130 y el #164— son «apariencia de éxito y nada avisando»; esto es
      # el espejo, «apariencia de fallo siempre», y ciega igual. Un fallo de
      # verdad aquí —el 403 del #130, por ejemplo— se vería idéntico al ruido.
      #
      # NO se arregla con `concurrency` + `cancel-in-progress`: cancelar este
      # job entre el merge y el disparo del deploy deja `main` fusionado y
      # producción atrás, que es exactamente el #130. Se arregla haciendo el
      # merge IDEMPOTENTE: si el PR ya está fusionado, este run no tiene nada
      # que hacer y lo dice.
      - name: Merge cuando el gate está en verde
        id: merge
        run: |
          set -uo pipefail
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          estado() { gh pr view "$PR" --repo "$REPO" --json state -q .state; }

          if [ "$(estado)" = "MERGED" ]; then
            echo "El otro run del mismo PR ya lo fusionó. Nada que hacer."
            echo "fusionado_aqui=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr merge "$PR" --squash --repo "$REPO"; then
            echo "fusionado_aqui=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Falló. Antes de dar error hay que distinguir la carrera de un fallo
          # real: si el otro run fusionó mientras este lo intentaba, el
          # resultado que importa —el PR fusionado— se cumplió. Se espera un
          # momento porque el merge del otro run puede no estar visible todavía.
          sleep 10
          if [ "$(estado)" = "MERGED" ]; then
            echo "El merge falló por la carrera, pero el PR quedó fusionado por el otro run."
            echo "fusionado_aqui=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::el merge falló y el PR NO está fusionado. Esto no es la carrera de los dos eventos: es un fallo real."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SOLO DISPARA EL DEPLOY EL RUN QUE FUSIONÓ. Si lo dispararan los dos,
      # cada PR desplegaría dos veces el mismo SHA — y este repositorio ya
      # peleó esa guerra: el job `guard` de deploy.yml existe porque se
      # acumularon cientos de despliegues que no cambiaban ni un dato.
      #
      # HUECO QUE QUEDA ABIERTO, dicho a propósito: si el run que fusiona se
      # muriera entre el merge y este paso —una caída del runner en una ventana
      # de dos segundos— el otro run vería «ya fusionado» y tampoco desplegaría,
      # dejando `main` por delante de producción sin nada en rojo. Es la
      # ventana del #130 y no se cierra aquí: cerrarla pediría que este job
      # averiguara si ya existe un deploy para el SHA de `main`, y meter esa
      # lógica en lo único que protege `main` cuesta más de lo que vale. Lo
      # cubre la comprobación manual que CLAUDE.md pide tras cada fusión:
      # que el último deploy corresponda al tip de `main`.
      - name: Disparar deploy (el push del bot no lo dispara solo)
        if: steps.merge.outputs.fusionado_aqui == 'si'
        run: gh workflow run "Deploy Give&Grow to Cloudflare" --ref main --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
