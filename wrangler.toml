name = "givegrow-website"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
# Estas rutas DEBEN estar aquí: sin ellas, `not_found_handling =
# single-page-application` se las traga y devuelve index.html en lugar de invocar
# al Worker. Le pasó a /api/* al construir la Fase 2, y volvería a pasar con
# /admin — que además serviría la SPA pública en lugar del panel protegido.
#
# `/` y `/caso/*` entraron el 19 ago por la marca de Mira Mi Casa. El Worker
# inyecta `data-marca="mmc"` en el <html> según el Host, y sin estar en esta
# lista la PORTADA la servía la capa de assets directamente: el Worker no
# corría, así que el subdominio salía con la marca de la fundación y todo
# parecía bien. Es la tercera vez que este mismo despiste muerde — /api/*,
# /triaje y ahora la raíz.
#
# Ojo con el coste: ahora el Worker se invoca en cada visita a la portada. Es
# aceptable porque su última línea es `env.ASSETS.fetch(request)`, o sea que
# para todo lo que no reconoce se limita a devolver el asset.
run_worker_first = ["/", "/caso/*", "/f/*", "/api/*", "/admin", "/admin.js", "/admin/*", "/ruta", "/ruta.js", "/triaje", "/triaje.js", "/triaje/*", "/triage", "/triage.js", "/evidencia/*", "/carnet/*"]

# Base PRIVADA (Ley 1581): donantes, aportes, inscripciones y consentimientos.
# Nunca se sirve al navegador. Los datos públicos de la red siguen en
# data/partners.json. Esquema en migrations/0001_inicial.sql.
[[d1_databases]]
binding = "DB"
database_name = "givegrow-privado"
database_id = "e40b0794-37ab-4461-bf59-53b682095446"

# Evidencia de terreno (Fase 6): fotos de las actas de entrega firmadas y de las
# jornadas. Va en R2 y no en el repositorio porque son archivos que crecen con
# cada salida y no tienen por qué versionarse ni redesplegarse con el sitio.
# Se sirven por /evidencia/… y SOLO si la entrega está publicada — ver worker.js.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "givegrow-media"

# La llave pública de Wompi NO es secreta (viaja en la URL del checkout), así
# que vive aquí y queda versionada. Las otras tres —privada, integridad y
# eventos— son secretos de Wrangler y NUNCA van en este archivo.
# El ambiente se deduce del prefijo: pub_test_ → sandbox, pub_prod_ →
# producción. Así es imposible que queden llaves de prueba apuntando a
# producción, que es el error clásico y el más caro.
[vars]
WOMPI_PUBLIC_KEY = "pub_prod_sA952OP2Y58ahrZRjHgutdBIr9U0FUr6"
# Correo transaccional. Sale de un SUBDOMINIO con su propio DKIM porque el
# dominio principal tiene el SPF roto, no publica DKIM y su DMARC está en
# p=reject — ver ops/correo-transaccional.md. La llave (RESEND_API_KEY) es
# secreto de Wrangler, nunca va aquí.
CORREO_DESDE = "Give&Grow International <no-responder@notificaciones.thegiveandgrowproject.org>"
# Aviso interno. Desde el 11 ago 2026 va al buzón institucional: el dominio ya
# autentica (SPF y DKIM pasan y ALINEAN, verificado con un informe de
# verifier.port25.com), así que el motivo para usar un Gmail personal desapareció.
# Ojo: aquí el dominio es DESTINATARIO, no remitente — quien firma es
# notificaciones.… vía Resend. Cambiarlo era seguro incluso antes.
CORREO_AVISOS = "contabilidad@thegiveandgrowproject.org"
CORREO_MMC = "MiraMiCasa@thegiveandgrowproject.org"

# ---------------------------------------------------------------------------
# PAYPAL — MEMBRESIAS INTERNACIONALES (PRODUCCION)
# ---------------------------------------------------------------------------
# NINGUNO ES SECRETO: identifican recursos de PayPal y no autorizan nada por si
# solos, igual que el AUD de Access. Los secretos -PAYPAL_CLIENT_ID y
# PAYPAL_SECRET, los del interruptor LIVE- van con `wrangler secret put` y nunca
# aqui.
#
# ⚠️ ESTOS IDS SON DE LIVE Y COBRAN DINERO REAL. Los de sandbox son OTROS y viven
# en [env.sandbox.vars]. Confundirlos es el error caro: una membresia de prueba
# apuntando a un plan real le cobra a alguien.
#
# El webhook id lo da el panel a veces con prefijo `WH-`; su API lo quiere pelado
# y el codigo lo recorta. Aqui va como lo entrego PayPal.
PAYPAL_ENTORNO = "live"
PAYPAL_WEBHOOK_ID = "8WN91706YM9366150"
# Creados con `PAYPAL_ENTORNO=live node ops/paypal-plans.mjs --crear` el 3 sep 2026.
PAYPAL_PRODUCTO = "PROD-3YL4767619199045K"
PAYPAL_PLAN_SEMILLA = "P-5L029923PY7871929NKMWNSI"
PAYPAL_PLAN_RETONO = "P-33P89059E34419313NKMWNSI"
PAYPAL_PLAN_ARBOL = "P-0XM89316XJ9677303NKMWNSI"
PAYPAL_PLAN_BOSQUE = "P-60151894XG4410524NKMWNSQ"
# Panel /admin. Ninguno de los dos es secreto: identifican la aplicación de
# Cloudflare Access, no autorizan nada por sí solos. Sin ellos el panel responde
# 503 y no sirve un dato — ver ops/panel-admin.md.
# El AUD es lo que impide que un token válido de OTRA aplicación de Access del
# mismo equipo sirva para entrar aquí.
ACCESS_TEAM_DOMAIN = "dark-wind-8484.cloudflareaccess.com"
ACCESS_AUD = "48d495e9504ba1eb77fccbb01f16da7123d69492f8d89868962bf169c030c39c"
# Segunda aplicación de Access, la del triage estructural: cubre /triage,
# /triage.js y /api/triage/*, y sus usuarios son los ingenieros voluntarios.
# Es OTRA audiencia a propósito — un token de esta NO abre /admin, donde están
# donantes, aportes y comprobantes bancarios. El panel solo acepta ACCESS_AUD.
ACCESS_AUD_TRIAGE = "cc6b16acd33e62b0c296265b762028e41ddb4b0328faaff001f1b497193dcc13"

# El entorno de PRUEBAS no lleva estas variables a propósito: no tiene su propia
# aplicación de Access, así que su panel debe seguir cerrado (503).

# ===========================================================================
# ENTORNO DE PRUEBAS
# ===========================================================================
# Copia completa del sitio con las llaves de SANDBOX de Wompi y su PROPIA base
# de datos, en su propio subdominio de workers.dev.
#
# Existe para no tener que poner producción en modo prueba, que tenía dos
# problemas reales: un donante que entrara en esa ventana pagaría en una
# pasarela de juguete creyendo que donó, y los eventos de sandbox escribirían
# aportes de prueba en la base de producción — contaminando el ledger de una
# fundación cuya tesis es la trazabilidad.
#
#   Desplegar:   npx wrangler deploy --env sandbox
#   Secretos:    npx wrangler secret put WOMPI_PRIVATE_KEY --env sandbox
#                npx wrangler secret put WOMPI_INTEGRITY_SECRET --env sandbox
#                npx wrangler secret put WOMPI_EVENTS_SECRET --env sandbox
#
# En el panel de Wompi, el ambiente SANDBOX debe apuntar sus eventos a
# <url del worker de sandbox>/api/wompi/eventos — nunca a la URL de producción.
[env.sandbox]
workers_dev = true

[env.sandbox.assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
# `true` y no una lista, a diferencia de producción: aquí TODA petición pasa por
# el Worker para que pueda marcar noindex. Con la lista, las peticiones a assets
# (incluida "/") se sirven sin invocar al Worker y la cabecera nunca se añadía —
# verificado: el header no aparecía. Producción conserva la lista, que es el
# camino rápido.
run_worker_first = true

[[env.sandbox.r2_buckets]]
binding = "MEDIA"
bucket_name = "givegrow-media"
# Prefijo aparte dentro del mismo bucket: las pruebas no ensucian la evidencia
# real y tampoco obligan a mantener dos buckets.
preview_bucket_name = "givegrow-media"

[[env.sandbox.d1_databases]]
binding = "DB"
database_name = "givegrow-privado-sandbox"
database_id = "624d07cc-845c-4b96-83c3-866f9a74c752"

[env.sandbox.vars]
WOMPI_PUBLIC_KEY = "pub_test_ws2Bo5M1W8mecXqqCWjjzpRjpQAHtlec"
CORREO_DESDE = "Give&Grow (pruebas) <no-responder@notificaciones.thegiveandgrowproject.org>"
# A propósito distinto de producción: los avisos de PRUEBA no deben caer en el
# buzón de contabilidad, que es donde se revisan los aportes reales. Mezclarlos
# haría que el buzón dejara de ser confiable como bandeja de trabajo.
CORREO_AVISOS = "fundaciongiveandgrow@gmail.com"
CORREO_MMC = "fundaciongiveandgrow+mmc@gmail.com"

# ---------------------------------------------------------------------------
# PAYPAL — MEMBRESIAS INTERNACIONALES, y va SOLO en este entorno
# ---------------------------------------------------------------------------
# NINGUNO DE ESTOS ES SECRETO. El id del webhook y los ids de plan identifican
# recursos de PayPal; no autorizan nada por si solos, igual que el AUD de Access.
# Los que SI son secretos -PAYPAL_CLIENT_ID y PAYPAL_SECRET- van con
# `npx wrangler secret put ... --env sandbox` y nunca aqui.
#
# ⚠️ POR QUE ESTO NO ESTA EN PRODUCCION, Y NO ES UN OLVIDO.
# La tentacion era poner las llaves de sandbox de PayPal en produccion para que
# sus webhooks tuvieran una URL publica a la que llegar. Este archivo ya explica
# arriba por que eso es exactamente lo que no se hace, y son las dos razones que
# valen: un donante que entrara en esa ventana pagaria en una pasarela de juguete
# creyendo que dono, y los eventos de prueba escribirian aportes falsos en la base
# de PRODUCCION — contaminando el ledger de una fundacion cuya tesis es la
# trazabilidad. El entorno de pruebas existe para esto y su URL de workers.dev es
# igual de publica.
#
# En el panel de desarrollador de PayPal, el webhook de SANDBOX debe apuntar a
# <url del worker de sandbox>/api/paypal/webhook — nunca a la de produccion.
PAYPAL_ENTORNO = "sandbox"
# OJO: SIN el prefijo `WH-`. El panel de PayPal lo muestra como
# "WH-37C1825267002473W" pero su API lo espera pelado, y con el prefijo la
# verificacion de firma devuelve FAILURE en silencio. El codigo tambien lo
# recorta por si acaso, pero aqui queda el valor tal como la API lo quiere.
PAYPAL_WEBHOOK_ID = "37C1825267002473W"
# Creados con `node ops/paypal-plans.mjs --crear` el 2 sep 2026. Son de SANDBOX:
# los de produccion son OTROS y hay que crearlos aparte con PAYPAL_ENTORNO=live.
PAYPAL_PRODUCTO = "PROD-41D12513UL2706608"
PAYPAL_PLAN_SEMILLA = "P-9BG09831XA1085144NKMMLNA"
PAYPAL_PLAN_RETONO = "P-7398672717248935BNKMMLNI"
PAYPAL_PLAN_ARBOL = "P-8T600504SC255541ENKMMLNQ"
PAYPAL_PLAN_BOSQUE = "P-0W178534CC254241JNKMMLNY"
