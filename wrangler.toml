name = "givegrow-website"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
# /api/* DEBE estar aquí: sin esto, `not_found_handling = single-page-application`
# se traga los endpoints y devuelve index.html en lugar de invocar el Worker.
run_worker_first = ["/f/*", "/api/*"]

# Base PRIVADA (Ley 1581): donantes, aportes, inscripciones y consentimientos.
# Nunca se sirve al navegador. Los datos públicos de la red siguen en
# data/partners.json. Esquema en migrations/0001_inicial.sql.
[[d1_databases]]
binding = "DB"
database_name = "givegrow-privado"
database_id = "e40b0794-37ab-4461-bf59-53b682095446"

# La llave pública de Wompi NO es secreta (viaja en la URL del checkout), así
# que vive aquí y queda versionada. Las otras tres —privada, integridad y
# eventos— son secretos de Wrangler y NUNCA van en este archivo.
# El ambiente se deduce del prefijo: pub_test_ → sandbox, pub_prod_ →
# producción. Así es imposible que queden llaves de prueba apuntando a
# producción, que es el error clásico y el más caro.
[vars]
WOMPI_PUBLIC_KEY = "pub_prod_sA952OP2Y58ahrZRjHgutdBIr9U0FUr6"
# Correo transaccional. Sale de un SUBDOMINIO con su propio DKIM porque el
# dominio principal tiene el SPF roto, no publica DKIM y su DMARC está en
# p=reject — ver ops/correo-transaccional.md. La llave (RESEND_API_KEY) es
# secreto de Wrangler, nunca va aquí.
CORREO_DESDE = "Give&Grow International <no-responder@notificaciones.thegiveandgrowproject.org>"
# Aviso interno a un buzón que SÍ recibe hoy. No usar el dominio propio mientras
# su DNS siga roto: rebotaría por su propio DMARC (error 550 5.7.26).
CORREO_AVISOS = "fundaciongiveandgrow@gmail.com"

# ===========================================================================
# ENTORNO DE PRUEBAS
# ===========================================================================
# Copia completa del sitio con las llaves de SANDBOX de Wompi y su PROPIA base
# de datos, en su propio subdominio de workers.dev.
#
# Existe para no tener que poner producción en modo prueba, que tenía dos
# problemas reales: un donante que entrara en esa ventana pagaría en una
# pasarela de juguete creyendo que donó, y los eventos de sandbox escribirían
# aportes de prueba en la base de producción — contaminando el ledger de una
# fundación cuya tesis es la trazabilidad.
#
#   Desplegar:   npx wrangler deploy --env sandbox
#   Secretos:    npx wrangler secret put WOMPI_PRIVATE_KEY --env sandbox
#                npx wrangler secret put WOMPI_INTEGRITY_SECRET --env sandbox
#                npx wrangler secret put WOMPI_EVENTS_SECRET --env sandbox
#
# En el panel de Wompi, el ambiente SANDBOX debe apuntar sus eventos a
# <url del worker de sandbox>/api/wompi/eventos — nunca a la URL de producción.
[env.sandbox]
workers_dev = true

[env.sandbox.assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
# `true` y no una lista, a diferencia de producción: aquí TODA petición pasa por
# el Worker para que pueda marcar noindex. Con la lista, las peticiones a assets
# (incluida "/") se sirven sin invocar al Worker y la cabecera nunca se añadía —
# verificado: el header no aparecía. Producción conserva la lista, que es el
# camino rápido.
run_worker_first = true

[[env.sandbox.d1_databases]]
binding = "DB"
database_name = "givegrow-privado-sandbox"
database_id = "624d07cc-845c-4b96-83c3-866f9a74c752"

[env.sandbox.vars]
WOMPI_PUBLIC_KEY = "pub_test_ws2Bo5M1W8mecXqqCWjjzpRjpQAHtlec"
CORREO_DESDE = "Give&Grow (pruebas) <no-responder@notificaciones.thegiveandgrowproject.org>"
CORREO_AVISOS = "fundaciongiveandgrow@gmail.com"
